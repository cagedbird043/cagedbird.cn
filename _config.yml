# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: 笼中鸟技术笔记
subtitle: "系统工程、Android 与开源工具的个人实践"
description: "笼中鸟技术笔记 - 记录系统工程、Android、网络、开源工具与个人技术实践的博客。"
keywords: CagedBird Blog 系统工程 Android Linux 网络 开源工具 技术实践 个人博客
author: CagedBird
language: zh-CN
timezone: "Asia/Shanghai"

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://cagedbird.cn
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - "baidu_verify_*.html"
  - "BingSiteAuth.xml"
  - "404.html"

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ""
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ""
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ""

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ""
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
# 用 date 而不是 mtime：CI checkout 会把所有文件的修改时间重置为构建时刻，用 mtime 时每篇文章的“修改时间”都会变成最近一次部署的时间。
# 现在没写 updated 的文章，修改时间等于发布时间；真正更新了内容的文章，在 front-matter 里手写 updated: YYYY-MM-DD HH:mm:ss。
updated_option: "date"

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: next

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
# deploy:
#   type: git
#   repo: git@github.com:cagedbird043/cagedbird.cn.git
#   branch: main

uglify:
  exclude:
    - "*.min.js"
  mangle: true
  # output:
  # compress:

clean_css:
  exclude:
    - "*.min.css"

html_minifier:
  enable: true # 启用 HTML 压缩以提升性能
  collapseBooleanAttributes: true
  collapseWhitespace: true
  # Ignore '<!-- more -->' https://hexo.io/docs/tag-plugins#Post-Excerpt
  ignoreCustomComments: [!!js/regexp /^\s*more/]
  removeComments: true
  removeEmptyAttributes: true
  removeScriptTypeAttributes: true
  removeStyleLinkTypeAttributes: true
  minifyJS: true
  minifyCSS: true

sitemap:
  path: sitemap.xml
  template: ./sitemap_template.xml
  rel: false
  tags: true
  categories: true

# mermaid
# see https://github.com/mermaid-js/mermaid
mermaid:
  enable: true
  # built-in themes: default/forest/dark/neutral
  theme:
    light: default
    dark: dark

# inject:
#   head:
#     # 自动给所有 CSS 文件加上基于时间戳的版本号
#     - <link rel="stylesheet" href="/css/style.css?v={{ version }}">
#   # 在 body 标签的末尾注入
#   body:
#     # 自动给所有 JS 文件加上基于时间戳的版本号
#     - <script src="/js/main.js?v={{ version }}"></script>

auto_category:
  enable: true
  multiple: true
  depth:

# RSS Feed
feed:
  enable: true
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content:
  content_limit: 140
  content_limit_delim: " "
  order_by: -date
  icon: icon.png
  autodiscovery: true
  template:

marked:
  prependRoot: true
  postAsset: true
